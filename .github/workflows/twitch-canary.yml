name: Twitch Canary

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run canary resolver unit tests
        run: node --test scripts/twitch-canary-selector.test.mjs
      - name: Select a live Twitch candidate
        id: select
        env:
          TWITCH_CANARY_CANDIDATES: ${{ vars.TWITCH_CANARY_CANDIDATES }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/twitch-canary-resolver.mjs >> "$GITHUB_ENV"
      - name: Run Twitch canary
        run: pnpm test:e2e:canary
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitch-canary-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
