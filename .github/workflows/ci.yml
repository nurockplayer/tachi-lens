name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      # Fetch full history so scripts/classify-risk.mjs can diff against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:model-policy
      - run: pnpm check:agent-docs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Test risk classifier
        run: node --test scripts/classify-risk.test.mjs
      - name: Classify change risk
        id: classify
        run: node scripts/classify-risk.mjs

  e2e:
    needs: check
    # Full Playwright E2E runs only for runtime-affecting changes; docs-only
    # changes skip it (classified deterministically by scripts/classify-risk.mjs).
    if: needs.check.outputs.e2e == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  model-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Detect policy changes
        id: policy
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.issue.number, per_page: 100 });
            core.setOutput('changed', files.some(file => file.filename === 'public/model-policy.json'));
      - name: Require a new policy revision
        if: steps.policy.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const candidate = JSON.parse(fs.readFileSync('public/model-policy.json', 'utf8'));
            let base;
            try {
              const result = await github.rest.repos.getContent({
                ...context.repo,
                path: 'public/model-policy.json',
                ref: context.payload.pull_request.base.sha,
              });
              if (Array.isArray(result.data) || result.data.type !== 'file') throw new Error('Base model policy is not a file');
              base = JSON.parse(Buffer.from(result.data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status === 404) {
                core.info('No model policy exists on the PR base; accepting the initial policy addition.');
                return;
              }
              throw error;
            }
            if (!Number.isSafeInteger(base.revision) || !Number.isSafeInteger(candidate.revision) || candidate.revision <= base.revision) {
              throw new Error('Model policy revision must strictly increase from the PR base.');
            }
            core.info(`Model policy revision increases from ${base.revision} to ${candidate.revision}.`);
      - uses: pnpm/action-setup@v4
        if: steps.policy.outputs.changed == 'true'
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        if: steps.policy.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.policy.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generate synthetic speech fixture
        if: steps.policy.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          espeak -w /tmp/model-speech-source.wav "Hello friends, enjoy the stream."
          ffmpeg -loglevel error -i /tmp/model-speech-source.wav -ar 16000 -ac 1 -c:a pcm_s16le /tmp/model-speech.wav
      - name: Probe exact candidate policy with synthetic inputs
        if: steps.policy.outputs.changed == 'true'
        env:
          MODEL_MONITOR_GEMINI_API_KEY: ${{ secrets.MODEL_MONITOR_GEMINI_API_KEY }}
          MODEL_MONITOR_DEEPSEEK_API_KEY: ${{ secrets.MODEL_MONITOR_DEEPSEEK_API_KEY }}
          SPEECH_PROBE_WAV: /tmp/model-speech.wav
        run: pnpm models:probe
      - uses: actions/upload-artifact@v4
        if: always() && steps.policy.outputs.changed == 'true'
        with:
          name: model-compatibility-${{ github.event.pull_request.head.sha }}
          path: model-compatibility-report.json
          if-no-files-found: warn
          retention-days: 30
