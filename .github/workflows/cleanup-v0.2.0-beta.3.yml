name: Cleanup v0.2.0-beta.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v0.2.0-beta.3.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable replacement is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets \
            --jq 'select(.isPrerelease == false) | .assets[] | select(.name == "tachi-lens.zip") | .name' \
            | grep -qx 'tachi-lens.zip'

      - name: Delete beta.3 Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0-beta.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v0.2.0-beta.3 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            echo 'beta.3 Release already absent; checking tag.'
            gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.2.0-beta.3" || true
          fi

      - name: Verify beta.3 is absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0-beta.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'beta.3 Release still exists.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.2.0-beta.3" >/dev/null 2>&1; then
            echo 'beta.3 tag still exists.' >&2
            exit 1
          fi
          echo 'v0.2.0-beta.3 Release and tag are absent.'
