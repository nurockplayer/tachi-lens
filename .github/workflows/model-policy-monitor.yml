name: Provider Model Drift

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: provider-model-drift
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load previous catalog observation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- tachi-lens:model-drift:v1 -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100 });
            const tracker = issues.find(issue => !issue.pull_request && issue.body?.startsWith(marker));
            if (tracker) {
              fs.writeFileSync('model-drift-tracker.json', JSON.stringify({ number: tracker.number, body: tracker.body }));
              const catalog = tracker.body.match(/<!-- catalog:(.*?) -->/s);
              if (catalog) fs.writeFileSync('model-catalog-previous.json', catalog[1]);
              const sources = tracker.body.match(/<!-- sources:(.*?) -->/s);
              if (sources) fs.writeFileSync('model-sources-previous.json', sources[1]);
            }
      - name: Observe official public metadata (no credentials, never promote)
        run: pnpm models:discover
      - name: Record meaningful drift or an operational failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- tachi-lens:model-drift:v1 -->';
            const tracker = fs.existsSync('model-drift-tracker.json') ? JSON.parse(fs.readFileSync('model-drift-tracker.json', 'utf8')) : undefined;
            const report = fs.existsSync('model-drift-report.json') ? JSON.parse(fs.readFileSync('model-drift-report.json', 'utf8')) : undefined;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (!report) {
              if (tracker?.body.includes('<!-- observation:operational-failure -->')) return;
              body = `${marker}\n<!-- observation:operational-failure -->\nCatalog observation failed. Check official public source availability and the bounded structural parser. This is an observation failure, not an empty catalog or model retirement. No policy was promoted.\n\nEvidence: ${runUrl}\n\n${tracker?.body.match(/<!-- catalog:.*? -->/s)?.[0] ?? ''}\n${tracker?.body.match(/<!-- sources:.*? -->/s)?.[0] ?? ''}`;
            } else {
              const alert = JSON.stringify(report.changes.filter(change => change.kind === 'not-documented' || change.kind === 'renew-policy'));
              const observation = `${report.fingerprint}:${alert}`;
              if (tracker?.body.includes(`<!-- observation:${observation} -->`)) return;
              if (report.changes.length === 0 && !tracker?.body.includes('operational-failure')) return;
              const sources = report.sources.map(source => `- ${source.provider}: ${source.url} (normalized fingerprint ${source.fingerprint})`).join('\n');
              const changes = report.changes.map(change => `- ${change.kind}: ${change.provider} / ${change.model}`).join('\n');
              body = `${marker}\n<!-- observation:${observation} -->\n## Provider model drift — validation required\n\nOfficial public documentation changes are candidates only; listing presence is not callable availability or compatibility. A missing listing means not documented, not API retirement. Do not promote by model name/version ordering. Validate request/response, chat, speech where applicable, request options, fallback/error/privacy regressions, latency and human translation quality before an ordinary reviewed policy PR. Unsupported API contracts require client engineering.\n\n${changes || 'Observation recovered; no catalog drift.'}\n\nPublic technical sources:\n${sources}\n\nPolicy revision: ${report.policyRevision}\nObserved: ${report.checkedAt}\nEvidence: ${runUrl}\n\n<!-- catalog:${JSON.stringify(report.observed)} -->\n<!-- sources:${JSON.stringify(report.sources)} -->`;
            }
            if (body.length > 60000) throw new Error('Drift evidence exceeds issue bound');
            if (tracker) await github.rest.issues.update({ ...context.repo, issue_number: tracker.number, state: 'open', body });
            else await github.rest.issues.create({ ...context.repo, title: 'Provider model drift: compatibility validation required', body });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-model-drift-${{ github.run_id }}
          path: model-drift-report.json
          if-no-files-found: warn
          retention-days: 30
